{% extends 'base.html' %}
{% block title %}{{ error.code }} — BUSBRA Vision{% endblock %}
{% block content %}<main class="narrow-page"><section class="panel"><p class="eyebrow">Erreur {{ error.code }}</p><h1 class="page-title">{{ 'Accès non autorisé' if error.code == 403 else 'Page indisponible' }}</h1><p>{{ error.description }}</p><a class="btn" href="{{ url_for('index') }}">Retour à l'accueil</a></section></main>{% endblock %}
