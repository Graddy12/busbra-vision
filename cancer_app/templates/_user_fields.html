<label>Nom complet<input name="name" required minlength="2" maxlength="120" value="{{ request.form.get('name', user.name if user else '') }}" autocomplete="name"></label>
<label>Identifiant<input name="username" required minlength="3" maxlength="80" pattern="[a-zA-Z0-9_.@-]+" value="{{ request.form.get('username', user.username if user else '') }}" autocomplete="off"></label>
<label>Spécialité<input name="specialty" list="specialties" maxlength="120" value="{{ request.form.get('specialty', user.specialty if user else '') }}"><datalist id="specialties"><option>Oncologie</option><option>Radiologie</option><option>Sénologie</option><option>Médecine générale</option><option>Administration</option></datalist></label>
<label>Rôle<select name="role">{% for code,label in [('doctor','Médecin'),('admin','Administrateur')] %}<option value="{{ code }}" {{ 'selected' if request.form.get('role', user.role if user else 'doctor') == code }}>{{ label }}</option>{% endfor %}</select></label>
<label>{{ 'Nouveau mot de passe (facultatif)' if user else 'Mot de passe initial' }}<input name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" {{ '' if user else 'required' }}></label>
<p class="quiet">10 caractères minimum. {{ 'Laissez vide pour conserver le mot de passe actuel.' if user else 'Les mots de passe sont enregistrés sous forme hachée.' }}</p>
